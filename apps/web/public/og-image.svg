<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#054A46" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#011819" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#010F10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0FAF7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle Background Grid -->
  <g opacity="0.08" stroke="#00BFB3" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Main Rounded Card Container -->
  <rect x="70" y="60" width="1060" height="510" rx="32" fill="#021C1D" stroke="#00BFB3" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Brand Icon Badge -->
  <g transform="translate(130, 115)">
    <rect width="96" height="96" rx="22" fill="#00BFB3"/>
    <path d="M17 50c11 0 11-14 21-14s11 14 21 14 11-14 21-14M17 68c11 0 11-14 21-14s11 14 21 14 11-14 21-14" stroke="#022425" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="250" y="170" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.02em">TidePay</text>
  <text x="250" y="206" fill="#00BFB3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.06em">NON-CUSTODIAL RECURRING BILLING ON SOLANA</text>

  <!-- Description Body -->
  <text x="130" y="285" fill="#EAF8F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" opacity="0.95">Deterministic, time-locked delegated pull payments with zero escrow vaults.</text>
  <text x="130" y="325" fill="#88B8B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400">Funds stay in user wallets. 1-click social checkout with Solana Actions &amp; Blinks.</text>

  <!-- Feature Pills (Centered inside the container) -->
  <g transform="translate(130, 395)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="46" rx="23" fill="#043234" stroke="#00BFB3" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="22" cy="23" r="6" fill="#14F195"/>
    <text x="38" y="29" fill="#EAF8F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Zero Escrow Lockups</text>

    <!-- Pill 2 -->
    <rect x="238" y="0" width="220" height="46" rx="23" fill="#043234" stroke="#00BFB3" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="260" cy="23" r="6" fill="#00BFB3"/>
    <text x="276" y="29" fill="#EAF8F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">1-Click Solana Blinks</text>

    <!-- Pill 3 -->
    <rect x="476" y="0" width="225" height="46" rx="23" fill="#043234" stroke="#00BFB3" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="498" cy="23" r="6" fill="#00BFB3"/>
    <text x="514" y="29" fill="#EAF8F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Autonomous Keepers</text>

    <!-- Pill 4 -->
    <rect x="719" y="0" width="180" height="46" rx="23" fill="#043234" stroke="#00BFB3" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="741" cy="23" r="6" fill="#14F195"/>
    <text x="757" y="29" fill="#EAF8F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Solana Devnet</text>
  </g>
</svg>
